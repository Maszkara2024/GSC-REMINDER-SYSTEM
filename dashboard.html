<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Research</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>window.tailwind = {config:{theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']}}}}}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="theme.css">
  </head>
<body class="text-slate-800 font-sans bg-slate-50">
  
    <header class="bg-white shadow-sm border-b border-slate-200">
      <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="font-semibold text-indigo-600 flex items-center gap-2">
            <span class="w-3 h-3 bg-indigo-600 rounded-full"></span>
            Research Project
        </div>
        <div class="flex items-center gap-3">
          <a id="studentsLink" href="students.html" class="hidden px-3 py-1 bg-amber-400 text-white rounded text-sm font-medium hover:bg-amber-500 transition">Students</a>
          <a id="studentProfileLink" href="student-profile.html" class="hidden px-3 py-1 bg-indigo-600 text-white rounded text-sm font-medium hover:bg-indigo-700 transition">Profile</a>
          <div id="currentUserDisplay" class="text-sm text-slate-700 font-medium"></div>
          <button id="logoutBtn" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded text-sm transition">Logout</button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <section class="md:col-span-2 bg-white rounded-xl p-6 shadow-sm border border-slate-200">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold text-slate-900">School Events</h2>
            <span id="eventTeacherOnly" class="text-[10px] bg-amber-100 text-amber-700 px-2 py-1 rounded-full font-bold uppercase hidden">Admin</span>
          </div>
          <div id="teacherEventPanel" class="mt-4 hidden p-4 bg-slate-50 rounded-lg border border-dashed border-slate-300">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <input id="eventTitle" placeholder="Event name" class="col-span-2 rounded border-slate-200 p-2 text-sm focus:ring-2 focus:ring-amber-400 outline-none" />
              <input id="eventDate" type="date" class="rounded border-slate-200 p-2 text-sm focus:ring-2 focus:ring-amber-400 outline-none" />
            </div>
            <div class="mt-3 flex justify-end">
              <button id="eventAddBtn" class="px-4 py-2 bg-amber-500 text-white rounded-lg text-sm font-bold shadow-sm hover:bg-amber-600 transition">Add Global Event</button>
            </div>
          </div>
          <div id="eventsList" class="mt-5 space-y-2 max-h-60 overflow-y-auto pr-2"></div>
        </section>

        <section id="assistantPanel" class="md:col-span-1 bg-white rounded-xl p-6 shadow-sm border border-slate-200 flex flex-col h-[500px]">
          <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
              <span class="text-indigo-600">✦</span> AI Assistant
          </h2>
          <div id="assistantMessages" class="flex-1 space-y-3 text-sm overflow-y-auto mb-4 pr-1 scrollbar-thin">
              <div class="bg-slate-100 p-2 rounded-lg mr-8 text-slate-600 italic text-xs">
                  Hello! I'm your research assistant. Ask me about your tasks or student performance.
              </div>
          </div>
          <div class="flex items-center gap-2 mt-auto border-t pt-3">
            <input id="assistantInput" class="flex-1 rounded-lg border-slate-200 p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ask about tasks..." />
            <button id="assistantSendBtn" class="p-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg>
            </button>
          </div>
        </section>

        <section class="md:col-span-2 bg-white rounded-xl p-6 shadow-sm border border-slate-200">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <h2 class="text-xl font-bold text-slate-900">Classroom Tasks</h2>
            <div id="studentTeacherSelector" class="flex items-center gap-2 bg-indigo-50 px-3 py-2 rounded-lg border border-indigo-100">
              <label class="text-[10px] font-black text-indigo-600 uppercase tracking-wider">Teacher:</label>
              <select id="viewTeacherSelect" class="rounded border-none text-xs font-bold p-1 bg-transparent outline-none text-slate-700 cursor-pointer min-w-[140px]">
                <option value="">Loading...</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-4 rounded-xl border border-blue-100 bg-blue-50/50">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-blue-900 text-sm">Activities</h3>
                <span id="activityTeacherOnly" class="text-[9px] bg-blue-200 text-blue-800 px-2 py-0.5 rounded-full font-bold uppercase hidden">Teacher</span>
              </div>
              <div id="activityTeacherPanel" class="mt-3 hidden mb-4 space-y-2">
                <input id="activityTitle" placeholder="Activity name" class="w-full rounded-lg border-slate-200 p-2 text-sm outline-none focus:ring-2 focus:ring-blue-400" />
                <input id="activityDate" type="date" class="w-full rounded-lg border-slate-200 p-2 text-sm outline-none focus:ring-2 focus:ring-blue-400" />
                <button id="activityAddBtn" class="w-full py-2 bg-blue-600 text-white rounded-lg text-sm font-bold shadow-sm hover:bg-blue-700 transition">Add Activity</button>
              </div>
              <div id="activityList" class="space-y-3"></div>
            </div>

            <div class="p-4 rounded-xl border border-purple-100 bg-purple-50/50">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-purple-900 text-sm">Performance</h3>
                <span id="performanceTeacherOnly" class="text-[9px] bg-purple-200 text-purple-800 px-2 py-0.5 rounded-full font-bold uppercase hidden">Teacher</span>
              </div>
              <div id="performanceTeacherPanel" class="mt-3 hidden mb-4 space-y-2">
                <input id="performanceTitle" placeholder="Task name" class="w-full rounded-lg border-slate-200 p-2 text-sm outline-none focus:ring-2 focus:ring-purple-400" />
                <input id="performanceDate" type="date" class="w-full rounded-lg border-slate-200 p-2 text-sm outline-none focus:ring-2 focus:ring-purple-400" />
                <button id="performanceAddBtn" class="w-full py-2 bg-purple-600 text-white rounded-lg text-sm font-bold shadow-sm hover:bg-purple-700 transition">Add Task</button>
              </div>
              <div id="performanceList" class="space-y-3"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, where, updateDoc, doc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBQNGAQGWwKrWHsDfN7mZwb4LA9jP8V8xI",
    authDomain: "gsc-reminder-system.firebaseapp.com",
    projectId: "gsc-reminder-system",
    storageBucket: "gsc-reminder-system.firebasestorage.app",
    messagingSenderId: "779246880500",
    appId: "1:779246880500:web:7da307e1ee407ad36a80a1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const curUser = JSON.parse(localStorage.getItem('currentUser::demo'));
  if (!curUser) { window.location.href = 'login.html'; }

  // --- AI STATE ---
  // This object captures all data loaded from Firebase to send to Gemini
  let firebaseState = {
    events: [],
    activities: [],
    performance: [],
    students: []
  };

  // --- 1. STUDENT TOGGLE LOGIC ---
  window.toggleStudentTask = async (docId, colName, isAlreadyDone) => {
    const docRef = doc(db, colName, docId);
    try {
      if (isAlreadyDone) {
        await updateDoc(docRef, { completedBy: arrayRemove(curUser.name) });
      } else {
        await updateDoc(docRef, { completedBy: arrayUnion(curUser.name) });
      }
    } catch (e) { console.error("Toggle failed:", e); }
  };

  // --- 2. TEACHER APPROVE SPECIFIC STUDENT ---
  window.approveIndividualStudent = async (docId, colName, studentName) => {
    try {
      const docRef = doc(db, colName, docId);
      await updateDoc(docRef, { 
        approvedStudents: arrayUnion(studentName) 
      });
    } catch (e) { console.error("Approval failed:", e); }
  };

  // --- 3. AI ASSISTANT FUNCTIONS ---
  const renderAIMessage = (role, text) => {
    const container = document.getElementById('assistantMessages');
    const msg = document.createElement('div');
    msg.className = role === 'user' 
      ? 'bg-indigo-50 p-2 rounded-lg ml-8 border border-indigo-100 text-slate-700 text-xs text-right' 
      : 'bg-white p-2 rounded-lg mr-8 border border-slate-200 text-slate-800 text-xs text-left shadow-sm';
    msg.textContent = text;
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
  };

  const queryAI = async (prompt) => {
  // This URL is provided by Firebase after you deploy
  const firebaseUrl = "https://askgemini-your-url.a.run.app"; 
  
  const res = await fetch(firebaseUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt, context: firebaseState })
  });
  const data = await res.json();
  return data.reply;
};

  const handleAISend = async () => {
    const input = document.getElementById('assistantInput');
    const btn = document.getElementById('assistantSendBtn');
    const prompt = input.value.trim();
    
    if (!prompt) return;

    // UI Feedback
    renderAIMessage('user', prompt);
    input.value = '';
    btn.disabled = true;
    btn.classList.add('opacity-50');

    const reply = await queryAI(prompt);
    
    renderAIMessage('ai', reply);
    btn.disabled = false;
    btn.classList.remove('opacity-50');
  };

  // --- 4. LOAD TEACHERS & STUDENTS (FOR AI CONTEXT) ---
  const loadClassroomContext = () => {
    // Sync teachers/students for AI to know who is who
    onSnapshot(collection(db, "users"), (snap) => {
      const users = [];
      snap.forEach(d => users.push(d.data()));
      firebaseState.students = users;
      
      // Update Teacher Select UI
      const selector = document.getElementById('viewTeacherSelect');
      const teachers = users.filter(u => u.role === 'teacher');
      selector.innerHTML = '<option value="">Select Teacher...</option>';
      teachers.forEach(t => {
        selector.innerHTML += `<option value="${t.name}">${t.name}</option>`;
      });
      if (curUser.role === 'teacher') selector.value = curUser.name;
    });
  };

  // --- 5. DATA FETCHING & UI RENDERING ---
  const setupFilteredListener = (colName, listId) => {
    const list = document.getElementById(listId);
    const selector = document.getElementById('viewTeacherSelect');
    let unsub;

    const runQuery = () => {
      if (unsub) unsub();
      const selT = selector.value;
      let q = (colName === "events") 
        ? query(collection(db, colName), orderBy("date", "asc"))
        : (selT ? query(collection(db, colName), where("teacherName", "==", selT), orderBy("date", "asc")) : null);

      if (!q) { 
        list.innerHTML = '<p class="text-[10px] italic text-slate-400 text-center py-4">Select a teacher</p>'; 
        return; 
      }

      unsub = onSnapshot(q, (snap) => {
        list.innerHTML = "";
        const currentItems = [];
        
        snap.forEach(fbDoc => {
          const item = fbDoc.data();
          const id = fbDoc.id;
          currentItems.push({ id, ...item });
          const isT = curUser.role === 'teacher';
          
          const iDone = item.completedBy?.includes(curUser.name);
          const iApproved = item.approvedStudents?.includes(curUser.name);
          const submissions = item.completedBy || [];
          const approvedList = item.approvedStudents || [];

          let html = `
            <div class="p-3 bg-white rounded-lg border border-slate-200 shadow-sm mb-2">
              <div class="flex justify-between items-start mb-2">
                <div>
                  <div class="text-xs font-bold">${item.title}</div>
                  <div class="text-[10px] text-indigo-600">${item.date}</div>
                </div>
              </div>`;

          if (!isT) {
            html += `<div class="mt-2">
              ${iApproved 
                ? '<div class="w-full py-1 bg-green-100 text-green-700 text-center rounded text-[10px] font-bold uppercase tracking-tighter">✓ Approved by Teacher</div>'
                : `<button onclick="toggleStudentTask('${id}', '${colName}', ${iDone})" 
                    class="w-full py-1 rounded text-[10px] font-bold transition ${iDone ? 'bg-amber-100 text-amber-600' : 'bg-indigo-600 text-white'}">
                    ${iDone ? 'Wait for Approval (Undo)' : 'Mark as Done'}
                  </button>`
              }
            </div>`;
          } else {
            html += `<div class="mt-2 pt-2 border-t border-slate-100 space-y-1">
              <div class="text-[9px] font-bold text-slate-400 uppercase">Submissions:</div>`;
            if (submissions.length === 0) html += `<div class="text-[9px] italic text-slate-400">No submissions yet</div>`;
            submissions.forEach(student => {
              const studentIsAppr = approvedList.includes(student);
              html += `
                <div class="flex items-center justify-between bg-slate-50 p-1.5 rounded">
                  <span class="text-[10px] font-medium text-slate-700">${student}</span>
                  ${studentIsAppr 
                    ? '<span class="text-[8px] font-black text-green-600 bg-green-50 px-1 rounded">APPROVED</span>'
                    : `<button onclick="approveIndividualStudent('${id}', '${colName}', '${student}')" 
                        class="text-[9px] bg-indigo-500 text-white px-2 py-0.5 rounded hover:bg-indigo-600 transition">
                        Approve
                      </button>`
                  }
                </div>`;
            });
            html += `</div>`;
          }
          html += `</div>`;
          list.innerHTML += html;
        });

        // Update AI Brain Context for this collection
        firebaseState[colName] = currentItems;
      });
    };
    selector.addEventListener('change', runQuery);
    runQuery();
  };

  // --- 6. ADDING DATA ---
  const addData = async (col, tId, dId) => {
    const title = document.getElementById(tId).value;
    const date = document.getElementById(dId).value;
    if (!title || !date) return alert("Fill all fields");
    const entry = { 
        title, 
        date, 
        createdAt: serverTimestamp(), 
        status: 'pending', 
        completedBy: [],
        approvedStudents: [] 
    };
    if (col !== "events") entry.teacherName = curUser.name;
    await addDoc(collection(db, col), entry);
    document.getElementById(tId).value = ""; document.getElementById(dId).value = "";
  };

  // --- 7. INITIALIZE UI & LISTENERS ---
  document.addEventListener('DOMContentLoaded', async () => {
    loadClassroomContext();
    const isT = curUser.role === 'teacher';
    if (isT) {
      document.querySelectorAll('#teacherEventPanel, #activityTeacherPanel, #performanceTeacherPanel, [id$="TeacherOnly"], #studentsLink').forEach(el => el?.classList.remove('hidden'));
    } else {
      document.getElementById('studentProfileLink')?.classList.remove('hidden');
    }
    document.getElementById('currentUserDisplay').textContent = `${curUser.name} (${curUser.role})`;

    setupFilteredListener("events", "eventsList");
    setupFilteredListener("activities", "activityList");
    setupFilteredListener("performance", "performanceList");

    // AI Listeners
    document.getElementById('assistantSendBtn').onclick = handleAISend;
    document.getElementById('assistantInput').onkeypress = (e) => {
        if (e.key === 'Enter') handleAISend();
    };

    // Form Listeners
    document.getElementById('eventAddBtn').onclick = () => addData("events", "eventTitle", "eventDate");
    document.getElementById('activityAddBtn').onclick = () => addData("activities", "activityTitle", "activityDate");
    document.getElementById('performanceAddBtn').onclick = () => addData("performance", "performanceTitle", "performanceDate");
    document.getElementById('logoutBtn').onclick = async () => { 
        await signOut(auth); 
        localStorage.removeItem('currentUser::demo'); 
        window.location.href = 'login.html'; 
    };
  });
</script>
</body>
</html>
