<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Research</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>window.tailwind = {config:{theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']}}}}}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="theme.css">
  </head>
<body class="text-slate-800 font-sans">
  
     <header class="bg-white shadow-sm">
      <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="font-semibold text-indigo-600">Research Project</div>
        <div class="flex items-center gap-3">
          <a id="studentsLink" href="students.html" class="hidden px-3 py-1 bg-amber-400 text-white rounded text-sm">Students</a>
          <a id="studentProfileLink" href="student-profile.html" class="hidden px-3 py-1 bg-indigo-600 text-white rounded text-sm">Profile</a>
          <div id="currentUserDisplay" class="text-sm text-slate-700"></div>
          <button id="logoutBtn" class="px-3 py-1 bg-slate-100 rounded">Logout</button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <section class="md:col-span-2 bg-white rounded-xl p-6 shadow-md border border-amber-100">
          <div class="flex items-center justify-between">
            <h2 class="text-2xl font-semibold text-slate-900">School Events</h2>
            <div class="flex items-center gap-3">
              <span id="eventTeacherOnly" class="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded hidden">Teacher Access</span>
            </div>
          </div>

          <div id="teacherEventPanel" class="mt-4 hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <input id="eventTitle" placeholder="Event name" class="col-span-2 rounded border-gray-200 p-2" />
              <input id="eventDate" type="date" class="rounded border-gray-200 p-2" />
            </div>
            <div class="mt-3 flex justify-end gap-2">
              <button id="eventAddBtn" class="px-4 py-2 bg-amber-500 text-white rounded">Add Global Event</button>
            </div>
          </div>

          <div id="eventsList" class="mt-5 space-y-2"></div>
        </section>

        <section id="assistantPanel" class="md:col-span-1 bg-white rounded-xl p-6 shadow-md border border-slate-100 row-span-2">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-semibold text-slate-900">AI Assistant</h2>
          </div>
          <div id="assistantMessages" class="mt-4 space-y-2 text-sm max-h-64 overflow-y-auto pr-1"></div>
          <div class="mt-4 flex items-center gap-2">
            <input id="assistantInput" class="flex-1 rounded border-gray-200 p-2 text-sm" placeholder="Ask AI..." />
            <button id="assistantSendBtn" class="px-3 py-2 bg-indigo-600 text-white rounded text-sm">Send</button>
          </div>
        </section>

        <section class="md:col-span-2 bg-white rounded-xl p-6 shadow-md border border-slate-100">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
            <h2 class="text-2xl font-semibold text-slate-900">Classroom Tasks</h2>
            
            <div id="studentTeacherSelector" class="flex items-center gap-2 bg-indigo-50 p-2 rounded-lg border border-indigo-100">
              <label class="text-[10px] font-bold text-indigo-600 uppercase">View Teacher:</label>
              <select id="viewTeacherSelect" class="rounded border-gray-300 text-sm p-1 bg-white outline-none min-w-[150px]">
                <option value="">Loading teachers...</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-4 rounded-lg border border-blue-100 bg-blue-50">
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold text-slate-800">Activities</h3>
                <span id="activityTeacherOnly" class="text-[10px] bg-blue-200 text-blue-800 px-2 py-1 rounded hidden">Teacher Only</span>
              </div>
              <div id="activityTeacherPanel" class="mt-3 hidden mb-3">
                <input id="activityTitle" placeholder="Activity name" class="w-full rounded border-gray-200 p-2 text-sm mb-2" />
                <input id="activityDate" type="date" class="w-full rounded border-gray-200 p-2 text-sm mb-2" />
                <button id="activityAddBtn" class="w-full py-2 bg-blue-600 text-white rounded text-sm">Add Activity</button>
              </div>
              <div id="activityList" class="space-y-2"></div>
            </div>

            <div class="p-4 rounded-lg border border-purple-100 bg-purple-50">
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold text-slate-800">Performance</h3>
                <span id="performanceTeacherOnly" class="text-[10px] bg-purple-200 text-purple-800 px-2 py-1 rounded hidden">Teacher Only</span>
              </div>
              <div id="performanceTeacherPanel" class="mt-3 hidden mb-3">
                <input id="performanceTitle" placeholder="Task name" class="w-full rounded border-gray-200 p-2 text-sm mb-2" />
                <input id="performanceDate" type="date" class="w-full rounded border-gray-200 p-2 text-sm mb-2" />
                <button id="performanceAddBtn" class="w-full py-2 bg-purple-600 text-white rounded text-sm">Add Task</button>
              </div>
              <div id="performanceList" class="space-y-2"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div id="toastContainer" class="fixed bottom-6 right-6 space-y-2 z-50"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBQNGAQGWwKrWHsDfN7mZwb4LA9jP8V8xI",
    authDomain: "gsc-reminder-system.firebaseapp.com",
    projectId: "gsc-reminder-system",
    storageBucket: "gsc-reminder-system.firebasestorage.app",
    messagingSenderId: "779246880500",
    appId: "1:779246880500:web:7da307e1ee407ad36a80a1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const curUser = JSON.parse(localStorage.getItem('currentUser::demo'));
  if (!curUser) { window.location.href = 'login.html'; }

  // 1. DYNAMIC TEACHER LIST LOAD (Now returns a Promise)
  const loadTeacherList = () => {
    return new Promise((resolve) => {
      const selector = document.getElementById('viewTeacherSelect');
      const teacherQuery = query(collection(db, "users"), where("role", "==", "teacher"));
      
      onSnapshot(teacherQuery, (snapshot) => {
        selector.innerHTML = '<option value="">Select Teacher...</option>';
        snapshot.forEach((doc) => {
          const teacher = doc.data();
          const opt = document.createElement('option');
          opt.value = teacher.name;
          opt.textContent = teacher.name;
          selector.appendChild(opt);
        });

        // Set default value based on logged in user or first teacher
        if (curUser.role === 'teacher') {
          selector.value = curUser.name;
        }
        resolve(); 
      });
    });
  };

  // 2. LAUNCH LOGIC
  document.addEventListener('DOMContentLoaded', async () => {
    await loadTeacherList(); // Wait for dropdown to be ready
    
    const isTeacher = curUser.role === 'teacher';
    if (isTeacher) {
      document.getElementById('teacherEventPanel')?.classList.remove('hidden');
      document.getElementById('activityTeacherPanel')?.classList.remove('hidden');
      document.getElementById('performanceTeacherPanel')?.classList.remove('hidden');
      document.querySelectorAll('[id$="TeacherOnly"]').forEach(el => el.classList.remove('hidden'));
      document.getElementById('studentsLink')?.classList.remove('hidden');
    }
    document.getElementById('currentUserDisplay').textContent = `${curUser.name} (${curUser.role})`;

    // Initialize Listeners AFTER dropdown is populated
    setupFilteredListener("events", "eventsList", "events");
    setupFilteredListener("activities", "activityList", "activities");
    setupFilteredListener("performance", "performanceList", "performance");
  });

  // 3. ADD DATA
  const addData = async (colName, titleId, dateId) => {
    const title = document.getElementById(titleId).value;
    const date = document.getElementById(dateId).value;
    if (!title || !date) return alert("Fill all fields");

    const entry = {
      title,
      date,
      createdAt: serverTimestamp()
    };

    if (colName !== "events") {
      entry.teacherName = curUser.name;
    }

    try {
      await addDoc(collection(db, colName), entry);
      document.getElementById(titleId).value = "";
      document.getElementById(dateId).value = "";
    } catch (e) { console.error("Error adding:", e); }
  };

  document.getElementById('eventAddBtn').onclick = () => addData("events", "eventTitle", "eventDate");
  document.getElementById('activityAddBtn').onclick = () => addData("activities", "activityTitle", "activityDate");
  document.getElementById('performanceAddBtn').onclick = () => addData("performance", "performanceTitle", "performanceDate");

  // 4. FILTERED SYNC (With Error Reporting)
  const setupFilteredListener = (colName, listId, brainKey) => {
    const list = document.getElementById(listId);
    const selector = document.getElementById('viewTeacherSelect');
    let unsubscribe;

    const updateQuery = () => {
      if (unsubscribe) unsubscribe(); 
      
      const selectedTeacher = selector.value;
      let q;

      if (colName === "events") {
        q = query(collection(db, colName), orderBy("date", "asc"));
      } else {
        if (!selectedTeacher) {
            list.innerHTML = '<p class="text-[10px] italic text-slate-400 text-center">Select a teacher above</p>';
            return;
        }
        q = query(collection(db, colName), orderBy("date", "asc"));
      }

      unsubscribe = onSnapshot(q, (snapshot) => {
        list.innerHTML = "";
        const dataArr = [];
        snapshot.forEach((doc) => {
          const item = doc.data();
          dataArr.push({ id: doc.id, ...item });
          list.innerHTML += `
            <div class="flex justify-between items-center p-2 bg-white rounded border border-slate-100 text-sm shadow-sm mb-2">
              <span>${item.title} - <b class="text-indigo-600">${item.date}</b></span>
            </div>`;
        });
        if (window.updateAIBrain) window.updateAIBrain(brainKey, dataArr);
      }, (err) => {
          console.error("Query Error:", err);
          // If you see this alert, open F12 Console and click the link!
          if (err.code === 'failed-precondition') {
            alert("Index needed for " + colName + ". Check browser console (F12) for the link!");
          }
      });
    };

    selector.addEventListener('change', updateQuery);
    updateQuery();
  };

  document.getElementById('logoutBtn').onclick = async () => {
    await signOut(auth);
    localStorage.removeItem('currentUser::demo');
    window.location.href = 'login.html';
  };
</script>

<script src="app.js"></script>
</body>
</html>
