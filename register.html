<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register — Research</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <main class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md p-6 bg-white rounded-xl shadow-md border border-slate-200">
            <h2 class="text-xl font-semibold text-indigo-600">Create an account</h2>
            <p class="text-sm text-slate-500 mt-1">Register as a student or teacher for the research project.</p>

            <form id="registerForm" class="mt-4 space-y-3">
                <div>
                    <label class="text-sm font-medium">Full Name</label>
                    <input id="name" type="text" placeholder="Juan Dela Cruz" class="mt-1 block w-full rounded border-gray-300 p-2 text-sm focus:ring-indigo-500 focus:border-indigo-500" required />
                </div>
                <div>
                    <label class="text-sm font-medium">Email</label>
                    <input id="email" type="email" placeholder="email@example.com" class="mt-1 block w-full rounded border-gray-300 p-2 text-sm focus:ring-indigo-500 focus:border-indigo-500" required />
                </div>
                <div>
                    <label class="text-sm font-medium">Password</label>
                    <input id="password" type="password" minlength="6" class="mt-1 block w-full rounded border-gray-300 p-2 text-sm focus:ring-indigo-500 focus:border-indigo-500" required />
                </div>
                <div>
                    <label class="text-sm font-medium">Confirm Password</label>
                    <input id="confirm" type="password" class="mt-1 block w-full rounded border-gray-300 p-2 text-sm focus:ring-indigo-500 focus:border-indigo-500" required />
                </div>
                <div>
                    <label class="text-sm font-medium">Role</label>
                    <select id="role" class="mt-1 block w-full rounded border-gray-300 p-2 text-sm focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>
                <div class="mt-2 text-sm">
                    <label class="inline-flex items-start gap-2 cursor-pointer">
                        <input id="agree" type="checkbox" class="mt-1 rounded text-indigo-600" required /> 
                        <span>I agree to the <a href="#" class="text-indigo-600 hover:underline">Terms & Data Use</a>.</span>
                    </label>
                </div>

                <div class="flex items-center justify-between mt-6">
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition w-full md:w-auto">
                        Register
                    </button>
                    <a href="login.html" class="text-sm text-indigo-600 hover:underline">Log in instead</a>
                </div>
            </form>

            <div id="msg" class="mt-4 text-center text-sm font-medium"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQNGAQGWwKrWHsDfN7mZwb4LA9jP8V8xI",
            authDomain: "gsc-reminder-system.firebaseapp.com",
            projectId: "gsc-reminder-system",
            storageBucket: "gsc-reminder-system.firebasestorage.app",
            messagingSenderId: "779246880500",
            appId: "1:779246880500:web:7da307e1ee407ad36a80a1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const showMsg = (text, isOk = false) => {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = isOk ? 'mt-4 text-center text-sm font-medium text-green-600' : 'mt-4 text-center text-sm font-medium text-red-600';
        };

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const role = document.getElementById('role').value;
            const agree = document.getElementById('agree').checked;

            if (password !== confirm) return showMsg('Passwords do not match');
            if (!agree) return showMsg('Please agree to terms');

            try {
                // 1. Create the Auth Account
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                const user = cred.user;

                // 2. Create the Firestore Profile (This is what was missing/failing)
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    role: role,
                    uid: user.uid,
                    createdAt: new Date()
                });

                showMsg('Success! Redirecting to login...', true);
                setTimeout(() => window.location.href = 'login.html', 1500);

            } catch (error) {
                console.error("Registration Error:", error);
                showMsg(error.message);
            }
        });
    </script>
</body>
</html>
